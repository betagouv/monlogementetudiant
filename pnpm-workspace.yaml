packages:
  - "."

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - better-auth@1.7.16
  - better-call@1.4.5
  - '@better-auth/api-key@1.7.16'
  - '@better-auth/core@1.7.16'
  - '@better-auth/drizzle-adapter@1.7.16'
  - '@better-auth/kysely-adapter@1.7.16'
  - '@better-auth/memory-adapter@1.7.16'
  - '@better-auth/mongo-adapter@1.7.16'
  - '@better-auth/prisma-adapter@1.7.16'
  - '@better-auth/telemetry@1.7.16'

overrides:
  esbuild: 0.25.0
  fast-uri: 3.1.8
  'vite@<6.4.4': 6.4.4

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  prisma: true
  sharp: true
  ssh2: true
