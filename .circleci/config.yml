version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:24

parameters:
  lockfile:
    type: string
    default: './pnpm-lock.yaml'
  cache_version:
    type: string
    default: 'v2'

workflows:
  version: 2
  mle_ci:
    jobs:
      - prepare_workspace_dependencies
      - lint:
          requires:
            - prepare_workspace_dependencies
      - build:
          requires:
            - prepare_workspace_dependencies
      - test_unit:
          requires:
            - prepare_workspace_dependencies
      - test_coverage:
          requires:
            - prepare_workspace_dependencies
      - test_e2e:
          requires:
            - prepare_workspace_dependencies

jobs:
  prepare_workspace_dependencies:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - run:
          name: 'Fetch dependencies'
          command: pnpm install --frozen-lockfile
      # Les jobs suivants lancent pnpm, qui réinstalle tout si node_modules ne correspond pas exactement à une
      # installation par défaut : on garde donc le virtual store par défaut et le node_modules du workspace worker.
      - save_cache:
          key: << pipeline.parameters.cache_version >>-pnpm-{{ checksum "<< pipeline.parameters.lockfile >>" }}
          paths:
            - ./node_modules
            - ./apps/worker/node_modules

  lint:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - create_dotenv_file
      - run:
          name: 'Lint'
          command: pnpm lint

  build:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - create_dotenv_file
      - run:
          name: 'Build'
          command: pnpm build

  test_unit:
    executor: node
    steps:
      - checkout
      - install_dependencies
      - run:
          name: 'Run unit tests'
          command: pnpm test:unit

  test_coverage:
    docker:
      - image: cimg/node:24
      - image: postgis/postgis:18-3.6
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mle_test
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      DATABASE_URL_TEST: postgres://test:test@localhost:5432/mle_test
      # Dans un conteneur, Node voit les CPU de l'hôte : on fixe le nombre de workers (une base de test par worker).
      VITEST_MAX_WORKERS: 4
    steps:
      - checkout
      - install_dependencies
      - create_dotenv_file
      - run:
          name: 'Wait for PostgreSQL'
          command: for i in $(seq 1 30); do pg_isready -h localhost -U test && break; sleep 2; done
      - run:
          name: 'Run full test suite with coverage'
          command: pnpm test:coverage
      - store_artifacts:
          path: coverage
          destination: coverage

  test_e2e:
    docker:
      - image: cimg/node:24
      - image: postgis/postgis:18-3.6
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mle_test
    environment:
      DATABASE_URL: postgres://test:test@localhost:5432/mle_e2e
      DATABASE_URL_TEST: postgres://test:test@localhost:5432/mle_e2e
    steps:
      - checkout
      - install_dependencies
      - run:
          name: 'Install Playwright Chromium'
          command: pnpm exec playwright install --with-deps chromium
      - run:
          name: 'Wait for PostgreSQL'
          command: for i in $(seq 1 30); do pg_isready -h localhost -U test && break; sleep 2; done
      - run:
          name: 'Run e2e tests'
          command: pnpm test:e2e
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results

commands:
  install_pnpm:
    steps:
      - run:
          name: 'Install pnpm'
          # Version lue dans le champ packageManager de package.json.
          command: sudo corepack enable && corepack install
          
  install_dependencies:
    steps:
      - install_pnpm
      - restore_cache:
          keys:
            - << pipeline.parameters.cache_version >>-pnpm-{{ checksum "<< pipeline.parameters.lockfile >>" }}

  create_dotenv_file:
    steps:
      - run:
          name: 'Create .env file from .env.dist'
          command: |
            cp .env.dist .env